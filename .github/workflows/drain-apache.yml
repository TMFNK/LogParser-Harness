name: Drain Apache 2k

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Sync and test
        run: uv sync --frozen --extra dev && uv run pytest -q
      - name: Fetch Apache 2k
        run: uv run python scripts/fetch_assets.py --dataset Apache
      - name: Drain + score
        run: |
          uv run python scripts/run_drain.py --dataset Apache
          uv run python scripts/score.py --dataset Apache --parser drain
      - name: Golden
        run: uv run python scripts/verify_golden.py
      - name: Fetch Linux/OpenSSH 2k
        run: uv run python scripts/fetch_assets.py --dataset Linux --dataset OpenSSH
      - name: Spell + score
        run: |
          for ds in Apache Linux OpenSSH; do
            uv run python scripts/run_spell.py --dataset "$ds"
            uv run python scripts/score.py --dataset "$ds" --parser spell
            slug="$(printf '%s' "$ds" | tr '[:upper:]' '[:lower:]')"
            uv run python scripts/verify_golden.py \
              --expected "expected/spell_${slug}_2k.json" \
              --actual "results/raw/spell_${slug}_scores.json"
          done
      - name: Checkout pinned Trail
        uses: actions/checkout@v4
        with:
          repository: TMFNK/LogParser-Trail
          ref: a17e1de60e612c88857da34615f2254082a7c013
          path: LogParser-Trail
      - name: Trail Apache/Linux/OpenSSH
        env:
          TRAIL_SRC: ${{ github.workspace }}/LogParser-Trail
        run: |
          for ds in Apache Linux OpenSSH; do
            uv run python scripts/run_trail.py --dataset "$ds"
            uv run python scripts/score.py --dataset "$ds" --parser trail
            slug="$(printf '%s' "$ds" | tr '[:upper:]' '[:lower:]')"
            uv run python scripts/verify_golden.py \
              --expected "expected/trail_${slug}_2k.json" \
              --actual "results/raw/trail_${slug}_scores.json"
          done
      - name: Table
        run: uv run python scripts/make_table.py
