[project]
name = "LogParser-Harness"
version = "0.1.0"
description = "Reproducible harness: Drain + EFParser baselines on LogHub-2.0 2k with shared eval (GA/PA/FGA/FTA)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0.0",
    "regex>=2024.0.0",
    "tqdm>=4.66.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
drain = [
    "logparser>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

# uv "virtual project" (scripts + config, no importable package).

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
