# Drain hyperparameters copied from logpai/logparser
# logparser/Drain/benchmark.py (Apache-2.0). Same depth/st/regex as
# Loghub-2.0 benchmark/old_benchmark/Drain_benchmark.py.
# Do not retune these if the goal is a Drain reproduction.

datasets:
  Apache:
    log_format: '\[<Time>\] \[<Level>\] <Content>'
    regex:
      - '(\d+\.){3}\d+'
    st: 0.5
    depth: 4
    max_children: 100
  Linux:
    log_format: '<Month> <Date> <Time> <Level> <Component>(\[<PID>\])?: <Content>'
    regex:
      - '(\d+\.){3}\d+'
      - '\d{2}:\d{2}:\d{2}'
    st: 0.39
    depth: 6
    max_children: 100
  OpenSSH:
    log_format: '<Date> <Day> <Time> <Component> sshd\[<Pid>\]: <Content>'
    regex:
      - '(\d+\.){3}\d+'
      - '([\w-]+\.){2,}[\w-]+'
    st: 0.6
    depth: 5
    max_children: 100
