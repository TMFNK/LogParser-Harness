# Drain settings per dataset.
# Apache values are the logparser demo defaults. Linux/OpenSSH log_format
# lines are PLACEHOLDERS — copy the exact regexes from Loghub-2.0
# benchmark/run_statistic_2k.sh before first run and delete this note.
# Format: python configparser file, one section per dataset.

[Apache]
log_format = <Date> <Time> <Level> <Pid> <Content>
depth = 4
sim_th = 0.4
max_children = 100

[Linux]
log_format = <Month> <Date> <Time> <Level> <Component>(\[<Pid>\])?: <Content>
depth = 4
sim_th = 0.4
max_children = 100

[OpenSSH]
log_format = <Date> <Day> <Time> <Content>
depth = 4
sim_th = 0.4
max_children = 100
